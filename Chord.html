<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>和弦听音训练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: #1a1a1a;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
        }

        .hidden { display: none; }

        .start-btn {
            width: 100%;
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            border-radius: 48px;
            padding: 16px 20px;
            font-size: 1.6rem;
            font-weight: 500;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-align: center;
        }
        .start-btn:hover { background: #333; border-color: #555; }
        .start-btn:active { transform: scale(0.98); }

        .quiz-header { display: flex; justify-content: flex-end; margin-bottom: 28px; }
        .menu-link {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: #888;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .menu-link:hover { color: #ccc; background: #252525; }

        .play-btn {
            width: 100%;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #ddd;
            cursor: pointer;
            margin-bottom: 32px;
            font-family: inherit;
        }
        .play-btn:active { background: #2e2e2e; transform: scale(0.98); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #202020;
            border: 1px solid #333;
            border-radius: 44px;
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #cfcfcf;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }
        .option-btn:active { background: #2c2c2c; transform: scale(0.97); }

        .feedback-area {
            min-height: 56px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 450;
        }
        .feedback-error { color: #e0856e; }
        .feedback-correct { color: #8bc48a; }

        .construction-area {
            background: #151515;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 24px;
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        .construction-title {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #6a6a6a;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .construction-content {
            font-size: 1rem;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: #d4d4d4;
            word-break: break-word;
            line-height: 1.5;
        }
        .construction-note {
            font-size: 0.9rem;
            color: #b8b06a;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .bottom-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .bottom-btn {
            background: #202020;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 450;
            color: #bbb;
            cursor: pointer;
            min-width: 100px;
            font-family: inherit;
        }
        .bottom-btn:active { background: #2a2a2a; transform: scale(0.97); }

        @media (max-width: 500px) {
            .container { padding: 24px 18px; }
            .option-btn { font-size: 0.85rem; padding: 12px 6px; }
            .construction-content { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container" id="appRoot">
    <div id="menuScreen">
        <button class="start-btn" id="startBtn">开始</button>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="quiz-header">
            <button class="menu-link" id="returnToMenuBtn">← 菜单</button>
        </div>

        <button class="play-btn" id="playChordBtn">▶ 播放和弦</button>

        <div class="options-grid" id="optionsContainer"></div>

        <div class="feedback-area" id="feedbackArea"></div>

        <div class="construction-area" id="constructionArea">
            <div class="construction-title">构成音</div>
            <div class="construction-content" id="constructionContent">—</div>
            <div class="construction-note" id="constructionNote"></div>
        </div>

        <div class="bottom-actions">
            <button class="bottom-btn" id="quizMenuBtn">菜单</button>
            <button class="bottom-btn" id="nextQuestionBtn">下一题</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 音频 ----------
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return audioCtx;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playTone(frequency, startTime = 0, duration = 1.5, volume = 0.22) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = frequency;
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const attack = 0.02;
            const release = 0.4;
            const sustainVol = volume * 0.7;
            const start = now + startTime;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(volume, start + attack);
            gain.gain.setValueAtTime(sustainVol, start + duration - release);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.start(start);
            osc.stop(start + duration);
        }

        // 分解 + 柱式 (答对后播放模式)
        function playArpeggioThenChord(rootFreq, intervals, baseDelay = 0) {
            if (!audioCtx) return;
            const noteDuration = 0.55;
            const gap = 0.2;
            let currentTime = baseDelay;
            intervals.forEach(ratio => {
                const freq = rootFreq * ratio;
                playTone(freq, currentTime, noteDuration, 0.2);
                currentTime += gap;
            });
            const chordStart = currentTime + 0.25;
            intervals.forEach(ratio => {
                const freq = rootFreq * ratio;
                playTone(freq, chordStart, 1.4, 0.24);
            });
        }

        // 普通柱式播放 (题目播放)
        function playChord(rootFreq, intervals) {
            if (!audioCtx) return;
            intervals.forEach(ratio => {
                const freq = rootFreq * ratio;
                playTone(freq, 0, 1.6, 0.22);
            });
        }
        
        // ---------- 和弦库 (每个和弦带上具体音名字符串) ----------
        // semitone 映射表用于计算实际音名
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        function getNoteNameFromRoot(rootName, semitoneOffset) {
            const rootIdx = noteNames.indexOf(rootName);
            if (rootIdx === -1) return '?';
            const targetIdx = (rootIdx + semitoneOffset) % 12;
            return noteNames[targetIdx];
        }

        // 生成构成音具体展示文本
        function buildConstructionText(rootName, chordDef) {
            const intervalsSemitone = chordDef.intervalsSemitone; // 半音偏移数组
            if (!intervalsSemitone) return chordDef.construction;
            const notes = intervalsSemitone.map(semi => getNoteNameFromRoot(rootName, semi));
            const parts = chordDef.intervalNames.map((name, idx) => `${name}(${notes[idx]})`);
            return `${rootName}${chordDef.name} : ${parts.join(' + ')}`;
        }

        const chordDefinitions = [
            { id: 'maj', name: '大三和弦', intervals: [1, 1.25, 1.5], intervalsSemitone: [0,4,7], intervalNames: ['根音', '大三度', '纯五度'], construction: '根音 + 大三度 + 纯五度' },
            { id: 'min', name: '小三和弦', intervals: [1, 1.2, 1.5], intervalsSemitone: [0,3,7], intervalNames: ['根音', '小三度', '纯五度'], construction: '根音 + 小三度 + 纯五度' },
            { id: 'aug', name: '增三和弦', intervals: [1, 1.25, 1.5874], intervalsSemitone: [0,4,8], intervalNames: ['根音', '大三度', '增五度'], construction: '根音 + 大三度 + 增五度' },
            { id: 'dim', name: '减三和弦', intervals: [1, 1.2, 1.4286], intervalsSemitone: [0,3,6], intervalNames: ['根音', '小三度', '减五度'], construction: '根音 + 小三度 + 减五度' },
            { id: 'maj7', name: '大七和弦', intervals: [1, 1.25, 1.5, 1.875], intervalsSemitone: [0,4,7,11], intervalNames: ['根音', '大三度', '纯五度', '大七度'], construction: '根音 + 大三度 + 纯五度 + 大七度' },
            { id: 'dom7', name: '属七和弦', intervals: [1, 1.25, 1.5, 1.75], intervalsSemitone: [0,4,7,10], intervalNames: ['根音', '大三度', '纯五度', '小七度'], construction: '根音 + 大三度 + 纯五度 + 小七度' },
            { id: 'min7', name: '小七和弦', intervals: [1, 1.2, 1.5, 1.75], intervalsSemitone: [0,3,7,10], intervalNames: ['根音', '小三度', '纯五度', '小七度'], construction: '根音 + 小三度 + 纯五度 + 小七度' },
            { id: 'minMaj7', name: '小大七和弦', intervals: [1, 1.2, 1.5, 1.875], intervalsSemitone: [0,3,7,11], intervalNames: ['根音', '小三度', '纯五度', '大七度'], construction: '根音 + 小三度 + 纯五度 + 大七度' },
            { id: 'halfDim7', name: '半减七和弦', intervals: [1, 1.2, 1.4286, 1.75], intervalsSemitone: [0,3,6,10], intervalNames: ['根音', '小三度', '减五度', '小七度'], construction: '根音 + 小三度 + 减五度 + 小七度' },
            { id: 'dim7', name: '减七和弦', intervals: [1, 1.2, 1.4286, 1.7143], intervalsSemitone: [0,3,6,9], intervalNames: ['根音', '小三度', '减五度', '减七度'], construction: '根音 + 小三度 + 减五度 + 减七度' },
            { id: 'augMaj7', name: '增大七和弦', intervals: [1, 1.25, 1.5874, 1.875], intervalsSemitone: [0,4,8,11], intervalNames: ['根音', '大三度', '增五度', '大七度'], construction: '根音 + 大三度 + 增五度 + 大七度' },
            { id: 'maj9', name: '大九和弦', intervals: [1, 1.25, 1.5, 1.875, 2.25], intervalsSemitone: [0,4,7,11,14], intervalNames: ['根音', '大三度', '纯五度', '大七度', '大九度'], construction: '根音 + 大三度 + 纯五度 + 大七度 + 大九度' },
            { id: 'dom9', name: '属九和弦', intervals: [1, 1.25, 1.5, 1.75, 2.25], intervalsSemitone: [0,4,7,10,14], intervalNames: ['根音', '大三度', '纯五度', '小七度', '大九度'], construction: '根音 + 大三度 + 纯五度 + 小七度 + 大九度' },
            { id: 'min9', name: '小九和弦', intervals: [1, 1.2, 1.5, 1.75, 2.25], intervalsSemitone: [0,3,7,10,14], intervalNames: ['根音', '小三度', '纯五度', '小七度', '大九度'], construction: '根音 + 小三度 + 纯五度 + 小七度 + 大九度' },
            { id: 'minMaj9', name: '小大九和弦', intervals: [1, 1.2, 1.5, 1.875, 2.25], intervalsSemitone: [0,3,7,11,14], intervalNames: ['根音', '小三度', '纯五度', '大七度', '大九度'], construction: '根音 + 小三度 + 纯五度 + 大七度 + 大九度' },
            { id: 'halfDim9', name: '半减九和弦', intervals: [1, 1.2, 1.4286, 1.75, 2.25], intervalsSemitone: [0,3,6,10,14], intervalNames: ['根音', '小三度', '减五度', '小七度', '大九度'], construction: '根音 + 小三度 + 减五度 + 小七度 + 大九度' },
            { id: 'dim9', name: '减九和弦', intervals: [1, 1.2, 1.4286, 1.7143, 2.25], intervalsSemitone: [0,3,6,9,14], intervalNames: ['根音', '小三度', '减五度', '减七度', '大九度'], construction: '根音 + 小三度 + 减五度 + 减七度 + 大九度' },
            { id: 'aug9', name: '增大九和弦', intervals: [1, 1.25, 1.5874, 1.875, 2.25], intervalsSemitone: [0,4,8,11,14], intervalNames: ['根音', '大三度', '增五度', '大七度', '大九度'], construction: '根音 + 大三度 + 增五度 + 大七度 + 大九度' },
            { id: 'dom7b9', name: '属七降九和弦', intervals: [1, 1.25, 1.5, 1.75, 2.1667], intervalsSemitone: [0,4,7,10,13], intervalNames: ['根音', '大三度', '纯五度', '小七度', '降九度'], construction: '根音 + 大三度 + 纯五度 + 小七度 + 降九度' },
            { id: 'dom7#9', name: '属七升九和弦', intervals: [1, 1.25, 1.5, 1.75, 2.3333], intervalsSemitone: [0,4,7,10,15], intervalNames: ['根音', '大三度', '纯五度', '小七度', '升九度'], construction: '根音 + 大三度 + 纯五度 + 小七度 + 升九度' },
            { id: 'sus2', name: '挂二和弦', intervals: [1, 1.125, 1.5], intervalsSemitone: [0,2,7], intervalNames: ['根音', '大二度', '纯五度'], construction: '根音 + 大二度 + 纯五度' },
            { id: 'sus4', name: '挂四和弦', intervals: [1, 1.333, 1.5], intervalsSemitone: [0,5,7], intervalNames: ['根音', '纯四度', '纯五度'], construction: '根音 + 纯四度 + 纯五度' },
            { id: 'add9', name: '加九和弦', intervals: [1, 1.25, 1.5, 2.25], intervalsSemitone: [0,4,7,14], intervalNames: ['根音', '大三度', '纯五度', '大九度'], construction: '根音 + 大三度 + 纯五度 + 大九度' },
            { id: '6', name: '六和弦', intervals: [1, 1.25, 1.5, 1.6667], intervalsSemitone: [0,4,7,9], intervalNames: ['根音', '大三度', '纯五度', '大六度'], construction: '根音 + 大三度 + 纯五度 + 大六度' },
            { id: '69', name: '六九和弦', intervals: [1, 1.25, 1.5, 1.6667, 2.25], intervalsSemitone: [0,4,7,9,14], intervalNames: ['根音', '大三度', '纯五度', '大六度', '大九度'], construction: '根音 + 大三度 + 纯五度 + 大六度 + 大九度' }
        ];

        const rootNotes = [
            { name: 'C', freq: 261.63 }, { name: 'C#', freq: 277.18 }, { name: 'D', freq: 293.66 },
            { name: 'D#', freq: 311.13 }, { name: 'E', freq: 329.63 }, { name: 'F', freq: 349.23 },
            { name: 'F#', freq: 369.99 }, { name: 'G', freq: 392.00 }, { name: 'G#', freq: 415.30 },
            { name: 'A', freq: 440.00 }, { name: 'A#', freq: 466.16 }, { name: 'B', freq: 493.88 }
        ];

        let currentRoot = null;
        let currentChord = null;
        let currentOptions = [];
        let currentAnswerId = '';
        let isAnswered = false;      // 答对后锁住，不再允许选择

        // DOM
        const menuScreen = document.getElementById('menuScreen');
        const quizScreen = document.getElementById('quizScreen');
        const startBtn = document.getElementById('startBtn');
        const returnToMenuBtn = document.getElementById('returnToMenuBtn');
        const quizMenuBtn = document.getElementById('quizMenuBtn');
        const nextQuestionBtn = document.getElementById('nextQuestionBtn');
        const playChordBtn = document.getElementById('playChordBtn');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackArea = document.getElementById('feedbackArea');
        const constructionContent = document.getElementById('constructionContent');
        const constructionNote = document.getElementById('constructionNote');

        function generateRandomQuestion() {
            const rootIdx = Math.floor(Math.random() * rootNotes.length);
            currentRoot = { ...rootNotes[rootIdx] };
            const chordIdx = Math.floor(Math.random() * chordDefinitions.length);
            currentChord = { ...chordDefinitions[chordIdx] };
            currentAnswerId = currentChord.id;

            let candidates = chordDefinitions.filter(c => c.id !== currentAnswerId);
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            let distractor = candidates.slice(0, 3);
            let optionItems = [...distractor, { id: currentChord.id, name: currentChord.name }];
            for (let i = optionItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionItems[i], optionItems[j]] = [optionItems[j], optionItems[i]];
            }
            currentOptions = optionItems.map(opt => ({ id: opt.id, name: opt.name }));
        }

        // 播放控制：根据是否答对/用户点击使用不同模式
        let useArpeggioMode = false;   // 正确后设为 true，直到下一题重置

        function playCurrentChordWithMode() {
            if (!currentRoot || !currentChord) return;
            const resumeAndPlay = () => {
                if (useArpeggioMode) {
                    playArpeggioThenChord(currentRoot.freq, currentChord.intervals, 0);
                } else {
                    playChord(currentRoot.freq, currentChord.intervals);
                }
            };
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().then(resumeAndPlay).catch(e=>console.log);
            } else {
                resumeAndPlay();
            }
        }

        // 刷新构成音显示（正确后调用）
        function updateConstructionDisplay() {
            if (!currentRoot || !currentChord) return;
            const detailed = buildConstructionText(currentRoot.name, currentChord);
            constructionContent.innerHTML = detailed;
            constructionNote.innerHTML = `🎵 根音: ${currentRoot.name} | 和弦: ${currentChord.name}`;
        }

        function renderOptions() {
            optionsContainer.innerHTML = '';
            currentOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.name;
                btn.dataset.id = opt.id;
                btn.addEventListener('click', (e) => {
                    if (isAnswered) return;
                    handleAnswer(opt.id, btn);
                });
                optionsContainer.appendChild(btn);
            });
        }

        function clearOptionsHighlight() {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.background = '#202020';
                btn.style.borderColor = '#333';
            });
        }

        function handleAnswer(selectedId, btnElement) {
            if (isAnswered) return;
            const isCorrect = (selectedId === currentAnswerId);
            if (isCorrect) {
                isAnswered = true;
                useArpeggioMode = true;      // 答对后切换为分解+柱式模式
                feedbackArea.innerHTML = '<div class="feedback-correct">✓ 正确</div>';
                updateConstructionDisplay();
                clearOptionsHighlight();
                btnElement.style.background = '#2c4a2e';
                btnElement.style.borderColor = '#5e8a5e';
                // 答对后立即播放分解+柱式帮助理解
                playCurrentChordWithMode();
            } else {
                feedbackArea.innerHTML = '<div class="feedback-error">✗ 错误，再听一次</div>';
                playCurrentChordWithMode();   // 错误时仍用当前模式(错误时还未解锁分解，但如果之前未解锁就是柱式)
                btnElement.style.transform = 'scale(0.96)';
                setTimeout(() => { if(btnElement) btnElement.style.transform = ''; }, 130);
                constructionContent.innerHTML = '—';
                constructionNote.innerHTML = '';
                btnElement.style.background = '#5a2a2a';
                setTimeout(() => {
                    if(btnElement) btnElement.style.background = '#202020';
                }, 200);
            }
        }

        function loadNewQuestion() {
            generateRandomQuestion();
            renderOptions();
            isAnswered = false;
            useArpeggioMode = false;          // 新题目重置为普通柱式播放
            feedbackArea.innerHTML = '';
            constructionContent.innerHTML = '—';
            constructionNote.innerHTML = '';
            clearOptionsHighlight();
            // 自动播放新题目 (柱式和弦)
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => playCurrentChordWithMode()).catch(e=>console.log);
            } else {
                playCurrentChordWithMode();
            }
        }

        function startGame() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(e=>console.log);
            }
            menuScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadNewQuestion();
        }

        function showMenu() {
            menuScreen.classList.remove('hidden');
            quizScreen.classList.add('hidden');
        }

        // 事件绑定
        startBtn.addEventListener('click', startGame);
        returnToMenuBtn.addEventListener('click', showMenu);
        quizMenuBtn.addEventListener('click', showMenu);
        nextQuestionBtn.addEventListener('click', () => { loadNewQuestion(); });
        playChordBtn.addEventListener('click', () => {
            if (currentRoot && currentChord) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => playCurrentChordWithMode());
                } else {
                    playCurrentChordWithMode();
                }
            }
        });

        window.addEventListener('load', () => { initAudio(); });
    })();
</script>
</body>
</html>
